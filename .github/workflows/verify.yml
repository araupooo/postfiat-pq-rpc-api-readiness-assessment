name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify shipped digests
        run: bash scripts/verify_digests.sh

      - name: Show classifier interface
        run: python3 src/rpc_inventory.py --help

      - name: Run full suite
        run: bash scripts/run_all.sh

      - name: Check run summary
        run: |
          python3 - <<'EOF'
          import json
          s = json.load(open("outputs/derived/run-summary.json"))
          assert s["pinned_commit"] == "0085a1ff885d6a446369cf73a4430f75af22be55", s
          assert s["method_count"] == 74, s
          assert s["steps"]["readiness_table"] == "pass", s["steps"]
          assert s["steps"]["classifier"] == "pass", s["steps"]
          assert s["steps"]["probe"] == "pass", s["steps"]
          for k, v in s["steps"].items():
              assert v == "pass" or v.startswith("skipped"), (k, v)
          m = json.load(open("run-manifest.json"))
          assert m["counts"]["methods"]["total"] == 74, m
          assert m["probes"]["passed"] == m["probes"]["total"] == 9, m
          print("run-summary OK:", s["steps"])
          EOF

      - name: Verify regenerated digests
        run: bash scripts/verify_digests.sh
